name: Deploy Security Blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build from clean Astro state
        uses: withastro/action@v6
        with:
          package-manager: npm
          node-version: '24'
          cache: 'false'
          build-cmd: 'rm -rf .astro node_modules/.astro dist && npm run build'
      - name: Verify no published articles or stale pages
        run: |
          if find dist/blog -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo 'Unexpected published article directories in dist/blog'
            find dist/blog -mindepth 1 -maxdepth 2 -type f
            exit 1
          fi
          if find dist/tags -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo 'Unexpected tag directories in dist/tags'
            find dist/tags -mindepth 1 -maxdepth 2 -type f
            exit 1
          fi
          echo 'Verified: build has no published articles or tags.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live site has no example articles
        shell: bash
        run: |
          set -euo pipefail
          base="https://tuna1999.github.io"
          ok=0
          for attempt in $(seq 1 12); do
            echo "Live site verification attempt: ${attempt}/12"
            if curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "${base}/?revision=${GITHUB_SHA}" -o /tmp/home.html \
              && curl -fsSL --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "${base}/blog/?revision=${GITHUB_SHA}" -o /tmp/blog.html \
              && ! grep -Eiq 'Latest research|AREAS OF FOCUS|Windows Malware Triage|A Repeatable Reverse Engineering Workflow|Threat Intelligence: Validate Before You Alert' /tmp/home.html \
              && grep -Fq 'No research published yet.' /tmp/blog.html \
              && ! grep -Eiq 'Windows Malware Triage|A Repeatable Reverse Engineering Workflow|Threat Intelligence: Validate Before You Alert' /tmp/blog.html; then
              ok=1
              break
            fi
            echo 'Old content still visible or site not reachable; retrying.'
            sleep 10
          done
          if [ "${ok}" -ne 1 ]; then
            echo 'ERROR: live site still does not reflect empty blog.'
            exit 1
          fi
          echo "Verified live homepage and empty blog for ${GITHUB_SHA}"
